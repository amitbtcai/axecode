name: Build (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to check out and build from"
        required: true
        type: string
      version:
        description: "Version to write to package.json before building"
        required: true
        type: string
      channel:
        description: "Poracode release channel (stable | nightly)"
        required: true
        type: string
      sentry_environment:
        description: "Value to send as SENTRY_ENVIRONMENT"
        required: false
        type: string
        default: production
    secrets:
      MAC_CSC_LINK:
        required: false
      MAC_CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false

permissions:
  contents: read

env:
  # Release runners are disposable single checkouts; use pnpm's standard local
  # virtual store so postinstall native rebuilds operate on this checkout.
  PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: "false"

jobs:
  build:
    # mac leg runs on macos-26: electron-builder 26 requires actool 26+ for the
    # Liquid Glass .icon asset catalog, and Xcode 26's toolchain crashes on the
    # macos-15 runner OS (AssetCatalogAgent / missing MediaToolbox symbols).
    # macos-26 needs the self-managed signing keychain below — electron-builder
    # 26.15.3's own keychain path is broken there (electron-builder#10066).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: dist-windows
            platform: win
            rust-targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
            electron-cache: "~/AppData/Local/electron/Cache"
          - os: ubuntu-latest
            artifact: dist-linux
            platform: linux
            rust-targets: x86_64-unknown-linux-musl
            electron-cache: "~/.cache/electron"
          - os: macos-26
            artifact: dist-mac
            platform: mac
            rust-targets: x86_64-apple-darwin,aarch64-apple-darwin
            electron-cache: "~/Library/Caches/electron"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      # electron-builder 26.15.3 passes the .p12 import password to
      # `security set-key-partition-list -k` instead of the temporary keychain's
      # own password (electron-builder#10066). macOS 15 tolerated the wrong
      # password; macOS 26 rejects it with SecKeychainUnlock. Build the signing
      # keychain ourselves, then let electron-builder discover the Developer ID
      # identity via CSC_IDENTITY_AUTO_DISCOVERY instead of CSC_LINK.
      - name: Prepare macOS signing keychain
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          KEYCHAIN="build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$MAC_CSC_LINK" | base64 --decode -o signing-cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import signing-cert.p12 -k "$KEYCHAIN" \
            -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f signing-cert.p12
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        shell: bash

      - name: Install Linux helper build tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/computer-use-helper

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Set package version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = process.env.RELEASE_VERSION;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
        shell: bash

      - name: Cache Electron binary
        uses: actions/cache@v5
        with:
          path: ${{ matrix.electron-cache }}
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # The packaging pipeline never launches Electron from the project's
          # node_modules: `pnpm run build` only bundles, and packaging runs
          # electron-builder in a clean staging dir that fetches its own Electron
          # dist. The root postinstall's enforced Chromium download is therefore
          # dead weight here, and its flaky/partial extractions (which exit 0 yet
          # leave no usable binary) intermittently fail the build. Skip it; the
          # other native deps (node-pty, better-sqlite3) are still verified.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build app
        run: pnpm run build
        shell: bash
        env:
          PORACODE_CHANNEL: ${{ inputs.channel }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ inputs.sentry_environment }}
          POSTHOG_ENABLED: ${{ vars.POSTHOG_ENABLED || '1' }}
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}
          POSTHOG_ENABLE_DEV: "0"

      - name: Prepare computer-use helper
        run: node scripts/prepare-computer-use-helper.mjs --platform "${{ matrix.platform }}" --require
        shell: bash

      - name: Upload Sentry source maps
        if: matrix.platform == 'linux'
        run: |
          # Local `pnpm run dist` cleans source maps before packaging. Release CI
          # uploads them from the build output first, then removes them below.
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "Sentry secrets are not configured; skipping source map upload."
            exit 0
          fi
          for attempt in 1 2 3; do
            if pnpm run sentry:sourcemaps; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Sentry source map upload failed after $attempt attempts."
              exit 1
            fi
            echo "::warning::Sentry source map upload attempt $attempt failed; retrying."
            sleep $((attempt * 10))
          done
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      - name: Remove packaged source maps
        run: pnpm run clean:sourcemaps
        shell: bash

      - name: Package Windows/Linux
        if: matrix.platform != 'mac'
        run: |
          pnpm run prepare:package-assets
          node scripts/build-desktop-artifact.mjs --platform "${{ matrix.platform }}" --skip-build
        shell: bash
        env:
          PORACODE_CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package macOS
        if: matrix.platform == 'mac'
        run: |
          pnpm run prepare:package-assets
          node scripts/build-desktop-artifact.mjs --platform mac --skip-build
        shell: bash
        env:
          PORACODE_CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Developer ID signing: do NOT set CSC_LINK/CSC_KEY_PASSWORD —
          # the identity is discovered from the keychain prepared above.
          # (electron-builder#10066 breaks its own keychain path on macOS 26.)
          # macOS notarization via Apple ID + app-specific password.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify macOS app bundles and updater ZIPs
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::error::APPLE_TEAM_ID is required to verify macOS release signatures."
            exit 1
          fi

          verify_app() {
            local app="$1"
            local signature
            local helper
            local helper_signature

            codesign --verify --deep --strict --verbose=4 "$app"
            signature="$(codesign --display --verbose=4 "$app" 2>&1)"
            if ! grep -q '^Authority=Developer ID Application:' <<<"$signature"; then
              echo "::error file=$app::$app is not signed with a Developer ID Application certificate."
              exit 1
            fi
            if ! grep -q "^TeamIdentifier=${APPLE_TEAM_ID}$" <<<"$signature"; then
              echo "::error file=$app::$app is not signed by the expected Apple team."
              exit 1
            fi

            helper="$app/Contents/Resources/computer-use-helper/darwin-universal/poracode-computer-use"
            codesign --verify --strict --verbose=4 "$helper"
            helper_signature="$(codesign -d --verbose=4 "$helper" 2>&1)"
            if ! grep -q 'flags=.*runtime' <<<"$helper_signature"; then
              echo "::error file=$helper::Computer-use helper is missing the hardened-runtime signature flag."
              exit 1
            fi

            main_executable="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            expected_arch="$(lipo -archs "$main_executable")"
            if [[ "$expected_arch" == *arm64* ]]; then
              while IFS= read -r -d '' binary; do
                binary_arches="$(lipo -archs "$binary" 2>/dev/null || true)"
                if [[ -n "$binary_arches" && "$binary_arches" != *arm64* ]]; then
                  echo "::error file=$binary::Apple-silicon app contains a Mach-O binary without an arm64 slice: $binary_arches"
                  exit 1
                fi
              done < <(find "$app" -type f -print0)
            fi
          }

          apps=(release/mac*/*.app)
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "::error::No branded macOS app bundles found under release/mac*."
            exit 1
          fi
          for app in "${apps[@]}"; do
            verify_app "$app"
          done

          zips=(release/*.zip)
          if [ "${#zips[@]}" -eq 2 ]; then
            :
          else
            echo "::error::Expected one updater ZIP per macOS architecture, found ${#zips[@]}."
            exit 1
          fi

          verify_root="$(mktemp -d "${RUNNER_TEMP}/poracode-update-verify.XXXXXX")"
          trap 'rm -rf "$verify_root"' EXIT
          zip_index=0
          for zip in "${zips[@]}"; do
            zip_index=$((zip_index + 1))
            extract_dir="$verify_root/$zip_index"
            mkdir -p "$extract_dir"
            ditto -x -k "$zip" "$extract_dir"
            zip_apps=("$extract_dir"/*.app)
            if [ "${#zip_apps[@]}" -ne 1 ]; then
              echo "::error file=$zip::Expected exactly one app bundle in updater ZIP, found ${#zip_apps[@]}."
              exit 1
            fi
            verify_app "${zip_apps[0]}"
          done
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/nightly*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7
