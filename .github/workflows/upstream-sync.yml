name: upstream-sync

on:
  schedule:
    - cron: "17 5 * * *" # daily 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Merge upstream/main into sync branch
        id: merge
        env:
          SYNC_BRANCH: sync/upstream
        run: |
          git config user.name "axecode-bot"
          git config user.email "bot@axeai.com"
          chmod +x scripts/upstream-merge.sh
          scripts/upstream-merge.sh > merge-out.txt 2>&1 || true
          cat merge-out.txt >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(OUTCOME|MERGED)=" merge-out.txt >> "$GITHUB_OUTPUT"
          sed -n '/^CONFLICTS<<EOF/,/^EOF/p' merge-out.txt | sed '1d;$d' > conflicts.txt

      - name: Push sync branch
        if: steps.merge.outputs.OUTCOME != 'uptodate'
        run: git push -f origin sync/upstream

      - name: Open or update sync PR or conflict issue
        if: steps.merge.outputs.OUTCOME != 'uptodate'
        env:
          GH_TOKEN: ${{ secrets.SYNC_GH_TOKEN || secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.merge.outputs.OUTCOME }}
          MERGED: ${{ steps.merge.outputs.MERGED }}
        run: |
          conflicts=$(cat conflicts.txt 2>/dev/null || true)

          if [ "$OUTCOME" = "conflicted" ]; then
            title="Upstream sync needs manual merge ($MERGED commits)"
            body="The daily sync found \`$MERGED\` upstream commits that conflict with the fork.

            An agent should:
            1. \`git checkout sync/upstream && git merge upstream/main\`
            2. Resolve per AGENTS.md merge discipline (additive seams, keep
               \`zeron-*\` names, Cargo version files resolve as ours).
            3. Push to \`sync/upstream\` and open a PR to \`main\`.

            Conflicted files:

            \`\`\`
            $conflicts
            \`\`\`"
            existing=$(gh issue list --state open --search "Upstream sync needs manual merge" --json number --jq '.[0].number' || true)
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --title "$title" --body "$body"
            else
              gh issue create --title "$title" --body "$body" --label "upstream-sync"
            fi
            exit 0
          fi

          title="Sync upstream/main ($MERGED commits)"
          body="Automated upstream sync of \`zeronsh/zeron\` into \`sync/upstream\`.

          Merge outcome: **$OUTCOME**

          Review the diff and merge when green. Merge rules live in AGENTS.md."

          existing=$(gh pr list --head sync/upstream --state open --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
          else
            gh pr create --title "$title" --body "$body" --base main --head sync/upstream
          fi
