    <meta name="theme-color" content="#070709" />
    <script data-mobile-display-bootstrap>
      // Safari's floating browser toolbar should blend with the in-flow app
      // paint, which needs a transparent theme-color. Installed Home Screen
      // apps instead need the opaque app color through the bottom safe area.
      // WebKit has reported inconsistent display-mode media-query values for
      // Home Screen apps, so the iOS-specific navigator.standalone signal (and
      // app-like display modes) must take precedence over "browser".
      (function () {
        try {
          var standalone =
            window.navigator.standalone === true ||
            window.matchMedia("(display-mode: standalone)").matches ||
            window.matchMedia("(display-mode: fullscreen)").matches;
          var ios =
            /iPad|iPhone|iPod/i.test(window.navigator.userAgent || "") ||
            (window.navigator.platform === "MacIntel" && window.navigator.maxTouchPoints > 1);
          var hasBrowserChrome =
            !standalone && window.matchMedia("(display-mode: browser)").matches;
          if (standalone) {
            document.documentElement.setAttribute("data-mobile-standalone", "true");
            if (ios) document.documentElement.style.setProperty("height", "100lvh");
          } else if (hasBrowserChrome) {
            document.documentElement.setAttribute("data-mobile-browser-chrome", "true");
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "transparent");
          }
        } catch (e) {
          // Keep the opaque default when display-mode cannot be queried.
        }
      })();
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Axe Code" />

    <style>
      :root {
        color-scheme: dark;
        background: #070709;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #070709;
      }

      body {
        overflow: hidden;
      }

      .mobile-boot-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #070709;
        color: #f4f4f5;
      }

      .mobile-boot-screen__wordmark {
        color: #eaf0fb;
        width: auto;
        /* The lockup is 997:128 (~7.8:1), so capping height at 10vw keeps it
           inside ~78vw on narrow screens. px, not rem: the app stylesheet
           shrinks the root font-size to 14px, which would visibly rescale a
           rem-sized logo while the boot screen is still up. */
        height: min(64px, 10vw);
      }
    </style>
    <script>
      // Preserve PWA state created before the product namespace changed.
      (function () {
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var legacyKey = localStorage.key(i);
            if (!legacyKey || !legacyKey.startsWith("lightcode")) continue;
            var currentKey = "poracode" + legacyKey.slice("lightcode".length);
            if (localStorage.getItem(currentKey) !== null) continue;
            var value = localStorage.getItem(legacyKey);
            if (value !== null) localStorage.setItem(currentKey, value);
          }
        } catch (e) {
          // Storage can be unavailable; the app can still start with defaults.
        }
      })();
    </script>
    <script>
      (function () {
        try {
          var prefersDark =
            !window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches;
          var appearance = prefersDark ? "dark" : "light";
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(appearance);
          document.documentElement.dataset.theme = appearance;
        } catch (e) {
          document.documentElement.classList.add("dark");
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <script>
      // Served over plain http on a LAN address the page is not a secure
      // context, so crypto.randomUUID is missing while the shared renderer
      // code assumes it exists. Classic script: runs before all modules.
      (function () {
        if (typeof crypto.randomUUID === "function") return;
        crypto.randomUUID = function () {
          var bytes = crypto.getRandomValues(new Uint8Array(16));
          bytes[6] = (bytes[6] & 0x0f) | 0x40;
          bytes[8] = (bytes[8] & 0x3f) | 0x80;
          var hex = "";
          for (var i = 0; i < 16; i++) hex += bytes[i].toString(16).padStart(2, "0");
          return (
            hex.slice(0, 8) +
            "-" +
            hex.slice(8, 12) +
            "-" +
            hex.slice(12, 16) +
            "-" +
            hex.slice(16, 20) +
            "-" +
            hex.slice(20)
          );
        };
      })();
    </script>
